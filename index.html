<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGUS CWD Energy Audit</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script><style>
:root{--bg:#f4f8f8;--panel:#fff;--ink:#17343a;--muted:#6a858a;--line:#dce8e9;--teal:#0b6b78;--teal2:#0e8794;--red:#c8443f;--green:#2f9e6f;--amber:#c9821e;--blue:#2e7da6;--shadow:0 8px 24px rgba(24,60,65,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{background:linear-gradient(135deg,#075c68,#0e8794);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;opacity:.78;font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:700}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.danger{color:#a52d2d}.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}.wrap{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar select,.toolbar input{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.85fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}.panel h2{margin:0 0 12px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#f7fbfb;border:1px solid var(--line);border-radius:10px;padding:12px}.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.stat .value{font-size:21px;font-weight:800;margin-top:4px}.table-wrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f2f8f8;color:#4c7076;z-index:1}.actions{display:flex;gap:5px}.small{font-size:11px;color:var(--muted)}.chartbox{height:600px}.curves{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}.curve-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.curve-head h3{margin:0}.meta{color:var(--muted);font-size:12px;margin-top:3px}.curvebox{height:520px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}.login-card h1{margin:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid .span2{grid-column:1/-1}.modal-bg{position:fixed;inset:0;background:rgba(8,39,44,.45);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{border:0;background:#e7f0f1;color:#48676c;padding:9px 12px;border-radius:9px;font-weight:700}.tab.active{background:var(--teal);color:#fff}.hidden{display:none!important}.notice{padding:10px 12px;background:#fff8e9;border:1px solid #f0d99c;border-radius:9px;font-size:12px;margin-bottom:12px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#e9f5f1;color:#257a58;font-weight:800;font-size:10px}.login-error{color:#a52d2d;font-size:12px;margin-top:8px}@media(max-width:1050px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{padding:15px}.wrap{padding:10px}.chartbox,.curvebox{height:470px}}
</style></head><body><div id="root"></div><script>
const API=localStorage.getItem('agus_energy_audit_api_url')||'PASTE_YOUR_APPS_SCRIPT_EXEC_URL';let token=localStorage.getItem('agus_energy_token')||'',role=localStorage.getItem('agus_energy_role')||'',username=localStorage.getItem('agus_energy_user')||'';let audits=[],details=[],curves=[],auditChart,curveCharts={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>x===''||x==null?null:Number(x);const fmt=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d);
async function post(action,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...p})});const j=await r.json();if(!j.ok)throw Error(j.error||'Request failed');return j}async function get(action){const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('token',token);const r=await fetch(u);const j=await r.json();if(!j.ok)throw Error(j.error||'Request failed');return j}
function loginView(err=''){root.innerHTML=`<div class="login"><div class="login-card"><div class="badge">AGUS · CWD ENERGY AUDIT</div><h1 style="margin-top:10px">Pumping Station Energy Audit</h1><p class="small"></p><div class="field"><label></label><input id="api" value="${esc(API==='PASTE_YOUR_APPS_SCRIPT_EXEC_URL'?'':API)}" placeholder=""></div><div class="field"><label>Username</label><input id="user" value="admin"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button>${err?`<div class="login-error">${esc(err)}</div>`:''}<p class="small" style="margin-top:14px">Starter account: admin / changeme123. Change it after deployment.</p></div></div>`}
async function doLogin(){try{const api=document.getElementById('api').value.trim();if(!api)throw Error('Enter your Apps Script /exec URL.');localStorage.setItem('agus_energy_audit_api_url',api);window.API=api;const j=await postNoToken('login',{username:document.getElementById('user').value,password:document.getElementById('pass').value});if(!j.ok)throw Error(j.error);token=j.token;role=j.role;username=j.username;localStorage.setItem('agus_energy_token',token);localStorage.setItem('agus_energy_role',role);localStorage.setItem('agus_energy_user',username);await start()}catch(e){loginView(e.message)}}
async function postNoToken(action,p){const r=await fetch(localStorage.getItem('agus_energy_audit_api_url')||document.getElementById('api').value,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...p})});return r.json()}
function shell(){root.innerHTML=`<div class="app"><header class="top"><div class="brand"><h1>AGUS CWD Energy Audit</h1><p>Multi-pumping-station performance · energy · efficiency · duty-point dashboard</p></div><div class="top-actions"><span>${esc(username)} · ${esc(role)}</span><button class="btn ghost" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="toolbar"><select id="siteSel" onchange="renderAll()"><option value="ALL">All Pump Stations</option></select><button class="btn primary" onclick="auditModal()">+ Add Audit</button><button class="btn" onclick="stationModal()">+ Add / Edit Station</button><button class="btn" onclick="curveModal()">Edit Pump Curve</button>${role==='admin'?`<button class="btn" onclick="usersModal()">Users</button>`:''}<button class="btn" onclick="reload()">Refresh</button></div><div class="tabs"><button id="tAudit" class="tab active" onclick="tab('audit')">Energy Audit</button><button id="tCurve" class="tab" onclick="tab('curve')">Pump Performance</button><button id="tFleet" class="tab" onclick="tab('fleet')">Station Fleet</button></div><section id="viewAudit"><div class="stats" id="stats"></div><div class="grid"><div class="panel"><h2>Audit History</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Station</th><th>V</th><th>A</th><th>PF</th><th>Hz</th><th>kW</th><th>Flow</th><th>Head</th><th>Eff.</th><th>Actions</th></tr></thead><tbody id="auditRows"></tbody></table></div></div><div class="panel"><h2>Energy Performance Trend</h2><div class="chartbox"><canvas id="trend"></canvas></div></div></div></section><section id="viewCurve" class="hidden"><div class="notice">Baha Baha is the visual basis: every station uses the same Head / Efficiency / Power chart language, with design point and measured duty points. Curve data remains in the workbook, so adding or editing a station does not require editing HTML.</div><div id="curveGrid" class="curves"></div></section><section id="viewFleet" class="hidden"><div class="panel"><h2>Pump Station Registry</h2><div class="table-wrap"><table><thead><tr><th>Station</th><th>Manufacturer</th><th>Model</th><th>Design Flow</th><th>Design Head</th><th>Design Eff.</th><th>Design Power</th><th>Hz</th><th>Actions</th></tr></thead><tbody id="fleetRows"></tbody></table></div></div></section></main></div>`}
function tab(x){['audit','curve','fleet'].forEach(a=>{document.getElementById('view'+a[0].toUpperCase()+a.slice(1)).classList.toggle('hidden',a!==x);document.getElementById('t'+a[0].toUpperCase()+a.slice(1)).classList.toggle('active',a===x)});if(x==='curve')renderCurves();}
function selected(){return document.getElementById('siteSel')?.value||'ALL'}function filtered(){let s=selected();return s==='ALL'?audits:audits.filter(a=>String(a.site)===s)}
function renderAll(){renderStats();renderAudits();renderTrend();renderCurves();renderFleet()}
function renderStats(){const r=filtered(),eff=r.map(x=>n(x.eff)).filter(x=>x!=null),sp=r.map(x=>n(x.specific)).filter(x=>x!=null),kw=r.map(x=>n(x.elecKw)).filter(x=>x!=null);const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;document.getElementById('stats').innerHTML=[['Audits',r.length,'records'],['Avg Efficiency',fmt(avg(eff),1),'wire-to-water'],['Avg Specific Energy',fmt(avg(sp),3),'kWh/m³'],['Peak Electrical',fmt(kw.length?Math.max(...kw):null,2),'kW']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="small">${x[2]}</div></div>`).join('')}
function renderAudits(){const rows=filtered();document.getElementById('auditRows').innerHTML=rows.map(a=>`<tr><td>${esc(a.date)}</td><td><b>${esc(a.site)}</b></td><td>${fmt(a.volts)}</td><td>${fmt(a.amps)}</td><td>${fmt(a.pf)}</td><td>${fmt(a.operatingHz)}</td><td>${fmt(a.elecKw)}</td><td>${fmt(a.lps)}</td><td>${fmt(a.head)}</td><td>${fmt(a.eff,1)}%</td><td class="actions">${role==='admin'?`<button class="btn" onclick="auditModal(${a.row})">Edit</button><button class="btn danger" onclick="delAudit(${a.row})">Delete</button>`:''}</td></tr>`).join('')||`<tr><td colspan="11">No audit records.</td></tr>`}
function renderTrend(){if(auditChart)auditChart.destroy();const ctx=document.getElementById('trend');if(!ctx)return;const r=[...filtered()].reverse();auditChart=new Chart(ctx,{type:'line',data:{labels:r.map(x=>x.date||''),datasets:[{label:'Electrical kW',data:r.map(x=>x.elecKw),tension:.25},{label:'Hydraulic kW',data:r.map(x=>x.hydKw),tension:.25,borderDash:[5,4]},{label:'Efficiency %',data:r.map(x=>x.eff),yAxisID:'y1',tension:.25}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{title:{display:true,text:'kW'}},y1:{position:'right',title:{display:true,text:'Efficiency %'},grid:{display:false}}}}})}
function groupCurves(site){const g={};site.curves.forEach(c=>{const hz=Number(c.hz);if(!g[hz])g[hz]=[];g[hz].push(c)});return g}
function renderCurves(){const grid=document.getElementById('curveGrid');if(!grid)return;Object.values(curveCharts).forEach(c=>c.destroy());curveCharts={};let list=curves;if(selected()!=='ALL')list=list.filter(x=>String(x.site)===selected());grid.innerHTML=list.map(s=>{const d=details.find(x=>String(x.borehole)===String(s.site))||{};return `<div class="panel"><div class="curve-head"><div><h3>${esc(s.site)}</h3><div class="meta">${esc(d.manufacturer||'')} · ${esc(d.model||'')} · Design ${fmt(d.designFlow)} m³/h @ ${fmt(d.designHead)} m</div></div><button class="btn" onclick="curveModal('${esc(s.site)}')">Edit Curve</button></div><div class="curvebox"><canvas id="c_${encodeURIComponent(s.site)}"></canvas></div></div>`}).join('')||'<div class="panel">No pump curves found. Add a station and curve.</div>';list.forEach(s=>drawCurve(s))}
function drawCurve(s){const el=document.getElementById('c_'+encodeURIComponent(s.site));if(!el)return;const d=details.find(x=>String(x.borehole)===String(s.site))||{};const g=groupCurves(s);const datasets=[];const freqs=Object.keys(g).sort((a,b)=>a-b);freqs.forEach((hz,idx)=>{const p=g[hz];const base=idx===0;datasets.push({label:`Head ${hz} Hz${base?' (original)':''}`,data:p.map(x=>({x:x.flow,y:x.head})),showLine:true,tension:.2,yAxisID:'head',pointRadius:base?2:3,borderWidth:base?3:2,fill:base?'origin':false});datasets.push({label:`Efficiency ${hz} Hz`,data:p.map(x=>({x:x.flow,y:x.eff})),showLine:true,tension:.2,yAxisID:'eff',pointRadius:2,borderDash:[5,4],borderWidth:1.5});datasets.push({label:`Power ${hz} Hz`,data:p.map(x=>({x:x.flow,y:x.power})),showLine:true,tension:.2,yAxisID:'power',pointRadius:2,borderDash:[2,3],borderWidth:1.5})});const stationAudits=audits.filter(a=>String(a.site)===String(s.site));const duty=stationAudits.map(a=>({x:a.lps!=null?a.lps*3.6:null,y:a.head,label:a.date,eff:a.eff,power:a.elecKw})).filter(x=>x.x!=null&&x.y!=null);if(duty.length)datasets.push({label:'Measured Duty Point',data:duty,showLine:false,pointRadius:7,pointHoverRadius:9,pointStyle:'rectRot',yAxisID:'head'});if(d.designFlow!=null&&d.designHead!=null)datasets.push({label:'Design Duty',data:[{x:Number(d.designFlow),y:Number(d.designHead)}],showLine:false,pointRadius:9,pointHoverRadius:11,pointStyle:'rectRot',yAxisID:'head'});curveCharts[s.id]=new Chart(el,{type:'scatter',data:{datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{position:'top',labels:{boxWidth:18,usePointStyle:true}},tooltip:{callbacks:{label:(ctx)=>{const x=ctx.raw||{};return `${ctx.dataset.label}: ${x.x!=null?Number(x.x).toFixed(1):'—'} m³/h @ ${x.y!=null?Number(x.y).toFixed(1):'—'} m${x.eff!=null?' · '+Number(x.eff).toFixed(1)+'%':''}`}}}},scales:{x:{type:'linear',title:{display:true,text:'Flow [m³/h]'}},head:{type:'linear',position:'left',title:{display:true,text:'Head [m]'}},eff:{type:'linear',position:'right',title:{display:true,text:'Efficiency [%]'},grid:{drawOnChartArea:false}},power:{type:'linear',position:'right',title:{display:true,text:'Power [kW]'},grid:{drawOnChartArea:false},display:false}}}})}
function renderFleet(){document.getElementById('fleetRows').innerHTML=details.map(d=>`<tr><td><b>${esc(d.borehole)}</b></td><td>${esc(d.manufacturer)}</td><td>${esc(d.model)}</td><td>${fmt(d.designFlow)}</td><td>${fmt(d.designHead)}</td><td>${fmt(d.designEff,1)}%</td><td>${fmt(d.designPower)}</td><td>${fmt(d.hz)}</td><td class="actions">${role==='admin'?`<button class="btn" onclick="stationModal('${esc(d.borehole)}')">Edit</button><button class="btn danger" onclick="delStation('${esc(d.borehole)}')">Delete</button>`:''}</td></tr>`).join('')}
function modal(title,body){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal"><h2>${title}</h2>${body}</div>`;document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};return bg}
function auditModal(row=null){if(role!=='admin')return;const a=row?audits.find(x=>x.row===row):{};const b=modal(row?'Edit Energy Audit':'Add Energy Audit',`<div class="formgrid"><div class="field"><label>Station</label><input id="f_site" value="${esc(a.site||'')}" list="siteList"><datalist id="siteList">${details.map(d=>`<option value="${esc(d.borehole)}">`).join('')}</datalist></div><div class="field"><label>Audit date</label><input id="f_date" value="${esc(a.date||'')}"></div><div class="field"><label>Manufacturer</label><input id="f_man" value="${esc(a.manufacturer||'')}"></div><div class="field"><label>Model</label><input id="f_model" value="${esc(a.model||'')}"></div><div class="field"><label>Voltage V</label><input id="f_v" type="number" step="0.01" value="${a.volts??''}"></div><div class="field"><label>Current A</label><input id="f_i" type="number" step="0.01" value="${a.amps??''}"></div><div class="field"><label>Power Factor</label><input id="f_pf" type="number" step="0.01" value="${a.pf??''}"></div><div class="field"><label>Electrical kW (manual if no V/A/PF)</label><input id="f_kw" type="number" step="0.01" value="${a.elecKw??''}"></div><div class="field"><label>Operating Hz</label><input id="f_hz" type="number" step="0.01" value="${a.operatingHz??''}"></div><div class="field"><label>Flow L/s</label><input id="f_q" type="number" step="0.01" value="${a.lps??''}"></div><div class="field"><label>Head m</label><input id="f_h" type="number" step="0.01" value="${a.head??''}"></div><div class="field"><label>Meter kWh</label><input id="f_kwh" type="number" step="0.01" value="${a.meterKwh??''}"></div><div class="field span2"><label>Notes</label><textarea id="f_note">${esc(a.note||'')}</textarea></div></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" onclick="saveAuditForm(${row||'null'},this)">Save Audit</button></div>`)}
async function saveAuditForm(row,btn){try{btn.disabled=true;const e={site:v('f_site'),date:v('f_date'),manufacturer:v('f_man'),model:v('f_model'),volts:n(v('f_v')),amps:n(v('f_i')),pf:n(v('f_pf')),elecKw:n(v('f_kw')),operatingHz:n(v('f_hz')),lps:n(v('f_q')),head:n(v('f_h')),meterKwh:n(v('f_kwh')),note:v('f_note')};await post(row?'updateAudit':'addAudit',row?{row,entry:e}:{entry:e});btn.closest('.modal-bg').remove();await reload()}catch(x){alert(x.message);btn.disabled=false}}
function v(id){return document.getElementById(id).value.trim()}
async function delAudit(row){if(confirm('Delete this audit record?')){try{await post('deleteAudit',{row});await reload()}catch(e){alert(e.message)}}}
function stationModal(site=''){if(role!=='admin')return;const d=details.find(x=>String(x.borehole)===String(site))||{};const b=modal(site?'Edit Pump Station':'Add Pump Station',`<div class="formgrid"><div class="field"><label>Station / Borehole Name</label><input id="s_site" value="${esc(d.borehole||site)}"></div><div class="field"><label>Manufacturer</label><input id="s_man" value="${esc(d.manufacturer||'')}"></div><div class="field"><label>Pump Model</label><input id="s_model" value="${esc(d.model||'')}"></div><div class="field"><label>Design Flow m³/h</label><input id="s_df" type="number" step="0.01" value="${d.designFlow??''}"></div><div class="field"><label>Design Head m</label><input id="s_dh" type="number" step="0.01" value="${d.designHead??''}"></div><div class="field"><label>Design Efficiency %</label><input id="s_de" type="number" step="0.01" value="${d.designEff??''}"></div><div class="field"><label>Design Power kW</label><input id="s_dp" type="number" step="0.01" value="${d.designPower??''}"></div><div class="field"><label>Operating / Design Hz</label><input id="s_hz" type="number" step="0.1" value="${d.hz??''}"></div><div class="field span2"><label>Source Workbook</label><input id="s_src" value="${esc(d.sourceWorkbook||'')}"></div></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" onclick="saveStationForm(this)">Save Station</button></div>`)}
async function saveStationForm(btn){try{btn.disabled=true;const e={site:v('s_site'),manufacturer:v('s_man'),model:v('s_model'),designFlow:n(v('s_df')),designHead:n(v('s_dh')),designEff:n(v('s_de')),designPower:n(v('s_dp')),hz:n(v('s_hz')),sourceWorkbook:v('s_src')};await post('saveStation',{station:e,originalSite:site});btn.closest('.modal-bg').remove();await reload()}catch(e){alert(e.message);btn.disabled=false}}
async function delStation(site){if(confirm('Delete station details and its pump curve? Audit records are retained.')){try{await post('deleteStation',{site});await reload()}catch(e){alert(e.message)}}}
function curveModal(site=''){if(role!=='admin')return;site=site||selected();if(site==='ALL')return alert('Select a station first.');const s=curves.find(x=>String(x.site)===String(site))||{site,curves:[]};const b=modal('Edit Pump Curve — '+esc(site),`<p class="small">Enter one row per curve point. Frequency separates curves. Use m³/h, m head, % efficiency, kW power.</p><div id="curveEditor"></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn" onclick="addCurveRow()">+ Row</button><button class="btn primary" onclick="saveCurveForm('${esc(site)}',this)">Save Curve</button></div>`);const ed=b.querySelector('#curveEditor');(s.curves.length?s.curves:[{hz:60,flow:0,head:'',eff:'',power:''}]).forEach(x=>curveRow(ed,x))}
function curveRow(ed,x){const d=document.createElement('div');d.className='formgrid curve-row';d.style.marginBottom='6px';d.innerHTML=`<div class="field"><label>Hz</label><input class="hz" type="number" step="0.1" value="${x.hz??''}"></div><div class="field"><label>Flow m³/h</label><input class="flow" type="number" step="0.01" value="${x.flow??''}"></div><div class="field"><label>Head m</label><input class="head" type="number" step="0.01" value="${x.head??''}"></div><div class="field"><label>Efficiency %</label><input class="eff" type="number" step="0.01" value="${x.eff??''}"></div><div class="field"><label>Power kW</label><input class="power" type="number" step="0.01" value="${x.power??''}"></div><div class="field"><label>&nbsp;</label><button class="btn danger" onclick="this.closest('.curve-row').remove()">Remove</button></div>`;ed.appendChild(d)}
function addCurveRow(){curveRow(document.getElementById('curveEditor'),{hz:60,flow:'',head:'',eff:'',power:''})}
async function saveCurveForm(site,btn){try{btn.disabled=true;const rows=[...document.querySelectorAll('.curve-row')].map(r=>({hz:n(r.querySelector('.hz').value),flow:n(r.querySelector('.flow').value),head:n(r.querySelector('.head').value),eff:n(r.querySelector('.eff').value),power:n(r.querySelector('.power').value)})).filter(x=>x.hz!=null&&x.flow!=null&&x.head!=null);await post('saveCurve',{site,rows});btn.closest('.modal-bg').remove();await reload()}catch(e){alert(e.message);btn.disabled=false}}
function usersModal(){if(role!=='admin')return;get('users').then(j=>{const b=modal('User Administration',`<div class="table-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody>${j.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'Yes':'No'}</td><td><button class="btn" onclick="userEdit(${u.row},'${esc(u.username)}','${esc(u.role)}',${u.active})">Edit</button></td></tr>`).join('')}</tbody></table></div><div class="modal-actions"><button class="btn primary" onclick="userEdit(null)">+ Add User</button></div>`)}).catch(e=>alert(e.message))}
function userEdit(row,u='',r='viewer',active=true){const b=modal(row?'Edit User':'Add User',`<div class="formgrid"><div class="field"><label>Username</label><input id="u_user" value="${esc(u)}"></div><div class="field"><label>Password ${row?'(blank = keep)':''}</label><input id="u_pass" type="password"></div><div class="field"><label>Role</label><select id="u_role"><option ${r==='admin'?'selected':''}>admin</option><option ${r==='viewer'?'selected':''}>viewer</option></select></div><div class="field"><label>Active</label><select id="u_active"><option value="true" ${active?'selected':''}>Yes</option><option value="false" ${!active?'selected':''}>No</option></select></div></div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button><button class="btn primary" onclick="saveUser(${row||'null'},this)">Save</button></div>`)}
async function saveUser(row,btn){try{const p={username:v('u_user'),password:v('u_pass'),role:v('u_role'),active:v('u_active')==='true'};await post(row?'updateUser':'addUser',row?{row,...p}:p);btn.closest('.modal-bg').remove();usersModal()}catch(e){alert(e.message)}}
async function reload(){const j=await get('bundle');audits=j.audits||[];details=j.details||[];curves=j.curves||[];const sel=document.getElementById('siteSel');const old=sel?.value||'ALL';if(sel)sel.innerHTML='<option value="ALL">All Pump Stations</option>'+details.map(d=>`<option value="${esc(d.borehole)}">${esc(d.borehole)}</option>`).join('');if(sel)sel.value=[...sel.options].some(o=>o.value===old)?old:'ALL';renderAll()}
async function start(){shell();try{await reload()}catch(e){if(/expired|auth/i.test(e.message)){logout()}else alert(e.message)}}function logout(){token='';localStorage.removeItem('agus_energy_token');localStorage.removeItem('agus_energy_role');localStorage.removeItem('agus_energy_user');loginView()}window.addEventListener('load',()=>{if(token&&API!=='PASTE_YOUR_APPS_SCRIPT_EXEC_URL')start();else loginView()});
</script></body></html>
